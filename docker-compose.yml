services:
  # 1. Database Service
  postgres_db:
    image: postgres:16-alpine
    container_name: loop_market_postgres #database name
    restart: always
    environment: #must match database
      POSTGRES_USER: loop_market_user
      POSTGRES_PASSWORD: loop_market_password_123
      POSTGRES_DB: loop_market_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Litestar Backend Service
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loop_market_container #docker container name
    restart: always
    ports:
      - "8000:8000" #outside port must different if other project use 8000 ,change to 8001:8000
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      # Use the database service name 'postgres_db' as the hostname
      DATABASE_URL: "postgresql+asyncpg://loop_market_user:loop_market_password_123@postgres_db:5432/loop_market_database" #must match env
    depends_on:
      - postgres_db

volumes:
  postgres_data:
